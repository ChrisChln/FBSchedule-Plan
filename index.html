<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>小时排班</title>
  <style>
    :root {
      --canvas: #f1f3f1;
      --panel: #fff;
      --panel-soft: #e9eeec;
      --ink: #142b3d;
      --ink-soft: #4f6676;
      --muted: #758894;
      --line: #d7dfdc;
      --grid: #e8eeec;
      --steel: #3d769b;
      --steel-deep: #24536f;
      --flow: #8eafbf;
      --amber: #cf8e1d;
      --amber-pale: #f5e8cb;
      --alert: #b45443;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--canvas); color: var(--ink);
      font-family: "Aptos", "Segoe UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 3px solid rgba(61,118,155,.35); outline-offset: 2px; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 22px 28px 36px; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
    .panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .chart-panel { padding: 18px 20px 15px; }
    .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .chart-title { margin: 0; font-size: 13px; font-weight: 700; }
    .legend { display: flex; align-items: center; gap: 15px; color: var(--ink-soft); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .legend-line { width: 17px; height: 0; border-top: 2px solid; }
    .legend-line.backlog { border-color: var(--steel); }
    .legend-line.sla { border-color: var(--alert); }
    .chart-range { min-height: 16px; margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .chart-wrap { margin-top: 9px; }
    svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
    .gridline { stroke: var(--grid); stroke-width: 1; }
    .axis { fill: var(--muted); font-size: 10px; font-family: inherit; }
    .series-fill { opacity: .11; }
    .table-panel { overflow: hidden; }
    .table-wrap { height: 568px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
    thead th { position: sticky; top: 0; z-index: 2; height: 40px; padding: 0 16px; background: #f6f8f7; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: left; font-weight: 700; }
    thead th:first-child, tbody td:first-child { padding-left: 19px; }
    tbody tr { height: 44px; }
    tbody td { height: 44px; padding: 4px 16px; border-bottom: 1px solid #edf1ef; color: var(--ink-soft); }
    tbody tr:hover { background: #f8faf9; }
    tbody tr:last-child td { border-bottom: 0; }
    .metric { min-width: 170px; }
    .metric-value { display: block; color: var(--ink); font-weight: 650; line-height: 16px; text-align: right; }
    .track { display: block; height: 4px; margin-top: 2px; overflow: hidden; background: #edf1ef; border-radius: 99px; }
    .fill { display: block; height: 100%; min-width: 1px; border-radius: inherit; }
    .fill.staff { background: var(--steel); }
    .fill.capacity { background: var(--steel-deep); }
    .fill.backlog { background: var(--steel); }
    .fill.sla { background: var(--alert); }
    .fill.pieces { background: var(--flow); }
    .empty { padding: 32px; color: var(--muted); text-align: center; }
    @media (max-width: 800px) {
      .shell { padding: 18px 16px 28px; }
      .charts { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .metric { min-width: 120px; }
      .shell { padding-left: 12px; padding-right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media print {
      body { background: white; }
      .shell { max-width: none; padding: 0; }
      .table-wrap { height: auto; overflow: visible; }
      thead th { position: static; }
    }
  </style>
</head>

      </article>

    </section>
  </main>

    const PALETTE = { steel: "#3d769b", amber: "#cf8e1d", alert: "#b45443", ink: "#142b3d", muted: "#758894", grid: "#e8eeec" };
    const numberFormat = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
    const fmt = value => numberFormat.format(Math.round(Number(value) || 0));
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const shortDate = date => {
      const [, month, day] = date.split("-");
      return `${Number(month)}/${Number(day)}`;
    };
    const hourOf = period => Number(String(period).slice(0, 2));
    const niceTick = (maximum, divisions = 4) => {
      if (maximum <= 0) return 1;
      const raw = maximum / divisions;
      const power = Math.pow(10, Math.floor(Math.log10(raw)));
      const scaled = raw / power;
      const factor = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 2.5 ? 2.5 : scaled <= 5 ? 5 : 10;
      return factor * power;
    };
    const compact = value => value >= 10000 ? `${(value / 10000).toFixed(value % 10000 ? 1 : 0)}万` : fmt(value);
    const visibleRows = () => DATA.hours;
    const WINDOW_SIZE = 12;
    const ROW_HEIGHT = 44;
    let lastWindowStart = -1;

    function windowStart() {
      const rows = visibleRows();
      const scrollTop = document.getElementById("hour-scroll").scrollTop || 0;
      return Math.max(0, Math.min(Math.floor(scrollTop / ROW_HEIGHT), Math.max(0, rows.length - WINDOW_SIZE)));
    }

    function chartRows() {
      return visibleRows().slice(windowStart(), windowStart() + WINDOW_SIZE);
    }

    function nextDate(date) {
      const [year, month, day] = date.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day + 1)).toISOString().slice(0, 10);
    }

    function windowRange(rows) {
      if (!rows.length) return "";
      const firstTime = rows[0].period.split("–")[0];
      const lastTime = rows[rows.length - 1].period.split("–")[1];
      const lastDay = lastTime === "00:00" && hourOf(rows[rows.length - 1].period) === 23 ? nextDate(rows[rows.length - 1].date) : rows[rows.length - 1].date;
      return `${shortDate(rows[0].date)} ${firstTime} — ${shortDate(lastDay)} ${lastTime}`;
    }

    function renderChart(targetId, field, title, color) {
      const rows = chartRows();
      const W = 1240, H = 310, m = { left: 62, right: 20, top: 12, bottom: 40 }, pw = W - m.left - m.right, ph = H - m.top - m.bottom;
      const maximum = Math.max(1, ...rows.map(row => Math.max(Number(row[field]) || 0, Number(row.slaOpen) || 0)));
      const tick = niceTick(maximum), yMax = Math.ceil(maximum / tick) * tick;
      const n = rows.length;
      const x = index => n <= 1 ? m.left + pw / 2 : m.left + pw * index / (n - 1);
      const y = value => m.top + ph - ph * value / yMax;
      let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;
      for (let i = 0; i <= 4; i++) {
        const value = yMax * i / 4, yy = y(value);
        svg += `<line class="gridline" x1="${m.left}" y1="${yy}" x2="${W - m.right}" y2="${yy}"/>`;
        svg += `<text class="axis" x="${m.left - 8}" y="${yy + 3}" text-anchor="end">${esc(compact(value))}</text>`;
      }
      rows.forEach((row, i) => {
        const periodLabel = row.period.split("–")[0];
        svg += `<text class="axis" x="${x(i)}" y="${H - 9}" text-anchor="middle">${esc(periodLabel)}</text>`;
      });
      const line = rows.map((row, i) => `${i ? "L" : "M"}${x(i)},${y(row[field])}`).join(" ");
      const slaLine = rows.map((row, i) => `${i ? "L" : "M"}${x(i)},${y(row.slaOpen)}`).join(" ");
      if (rows.length) {
        const area = `${line} L${x(n - 1)},${m.top + ph} L${x(0)},${m.top + ph} Z`;
        svg += `<path d="${area}" class="series-fill" fill="${color}"/>`;
        svg += `<path d="${line}" fill="none" stroke="${color}" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>`;
        svg += `<path d="${slaLine}" fill="none" stroke="${PALETTE.alert}" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>`;
        rows.forEach((row, i) => {
          svg += `<circle cx="${x(i)}" cy="${y(row[field])}" r="${n > 80 ? 1.7 : 2.6}" fill="${color}"><title>${esc(row.date)} · ${esc(row.period)} · ${esc(title)} ${fmt(row[field])}</title></circle>`;
          svg += `<circle cx="${x(i)}" cy="${y(row.slaOpen)}" r="${n > 80 ? 1.7 : 2.6}" fill="${PALETTE.alert}"><title>${esc(row.date)} · ${esc(row.period)} · 今日SLA未完成 ${fmt(row.slaOpen)}</title></circle>`;
        });
      }
      svg += `</svg>`;
      document.getElementById(targetId).innerHTML = svg;
    }

    function metricCell(value, maximum, kind) {
      const percent = maximum > 0 ? Math.max(0, Math.min(100, Number(value) / maximum * 100)) : 0;
      return `<div class="metric"><span class="metric-value">${fmt(value)}</span><span class="track"><span class="fill ${kind}" style="width:${percent.toFixed(1)}%"></span></span></div>`;
    }

    function renderTable() {
      const rows = visibleRows();
      if (!rows.length) {
        document.getElementById("hour-scroll").innerHTML = `<div class="empty">—</div>`;
        return;
      }
      const maxStaff = Math.max(...rows.map(row => row.staff));
      const maxCapacity = Math.max(...rows.map(row => row.capacity));
      const maxBacklog = Math.max(...rows.map(row => row.backlog));
      const maxSla = Math.max(...rows.map(row => row.slaOpen));
      const maxPieces = Math.max(...rows.map(row => row.pieces));
      let html = `<table><thead><tr><th>日期</th><th>时间段</th><th>同时在岗人数</th><th>理论产能</th><th>小时结束积压</th><th>今日SLA未完成</th><th>预测件量</th></tr></thead><tbody>`;
      for (const row of rows) {
        html += `<tr><td>${esc(shortDate(row.date))}</td><td>${esc(row.period)}</td><td>${metricCell(row.staff, maxStaff, "staff")}</td><td>${metricCell(row.capacity, maxCapacity, "capacity")}</td><td>${metricCell(row.backlog, maxBacklog, "backlog")}</td><td>${metricCell(row.slaOpen, maxSla, "sla")}</td><td>${metricCell(row.pieces, maxPieces, "pieces")}</td></tr>`;
      }
      html += `</tbody></table>`;
      document.getElementById("hour-scroll").innerHTML = html;
    }

    function renderCharts() {
      const rows = chartRows();
      document.getElementById("backlog-range").textContent = windowRange(rows);
      renderChart("backlog-chart", "backlog", "小时结束积压", PALETTE.steel);
      lastWindowStart = windowStart();
    }

    function render() {
      renderTable();
      renderCharts();
    }

    function init() {
      document.getElementById("hour-scroll").addEventListener("scroll", () => {
        const start = windowStart();
        if (start !== lastWindowStart) renderCharts();
      });
      render();
    }

    init();
  </script>
